project:
  type: book
  output-dir: docs
  
book:
  title: "Predictive Analytics"
  author: Prof. Dr. Dominik Liebl
  date: last-modified
  date-format: "[Last Updated on] MMMM DD, YYYY"
  search: true
  sidebar:
    logo: images/KU_Logo_Blau_M.png
    number-depth: 3
  chapters:
    - index.qmd
    - 01-Introduction-to-R.qmd
    - 02-Probability.qmd
    - 04-Monte-Carlo-Simulations.qmd
    - 03-Matrix-Algebra.qmd
    - 05-Multiple-Linear-Regression.qmd
    - 06-Small-Sample-Inference.qmd
    - 07-Asymptotics.qmd
    # - 07-Instrumental-Variables.qmd

bibliography: references.bib

execute:
  cache: true

format:
  html:
    theme:
      light: [flatly, theme.scss]
      dark: [flatly, darkly, theme.scss, theme-dark.scss]
    html-math-method:
      method: mathjax
      url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/latest.js?config=TeX-MML-AM_CHTML"
    number-sections: true
    code-link: true
    reference-links: true
    reference-location: margin
    knitr:
      opts_chunk:
        fig.align: center
        fig-align: center
        # Plot theming (transparent canvas + dark-mode-safe chrome colours)
        # lives in _common.R, sourced by the setup chunk of every chapter.
